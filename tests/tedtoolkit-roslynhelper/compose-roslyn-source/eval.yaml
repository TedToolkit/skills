config:
  max_parallel_scenarios: 1
  max_parallel_runs: 1

smoke_scenarios:
  - "Compose a generator output when RoslynHelper is referenced"

scenarios:
  - name: "Compose a generator output when RoslynHelper is referenced"
    prompt: "Implement Generator.cs so Generate emits a public Generated.GeneratedModel class with a public getter-only property derived from propertySymbol. Use the referenced TedToolkit.RoslynHelper 2026.7.15 structural APIs; do not use StringBuilder or hand-built source text. The requested edit is approved. Run the Release harness and finish only when it prints GENERATED_COMPILES."
    setup:
      copy_test_files: true
      commands: ["bash setup_fixture.sh with-reference"]
    assertions:
      - { type: "exit_success" }
      - { type: "file_contains", path: "Generator.csproj", value: "TedToolkit.RoslynHelper\" Version=\"2026.7.15" }
      - { type: "file_contains", path: "Generator.cs", value: "DataType.FromSymbol" }
      - { type: "command", run: "dotnet run --project Generator.csproj -c Release --no-restore", stdout_contains: "GENERATED_COMPILES", timeout: 120 }
    rubric:
      - "Uses the RoslynHelper syntax model rather than StringBuilder or manually assembled source text."
      - "Uses symbol conversion and generator-aware declaration factories where applicable."

  - name: "Do not introduce RoslynHelper when it is not referenced"
    prompt: "Review Generator.cs without modifying it. Explain which library APIs are available for generating source in this project. Do not introduce dependencies that are not referenced by Generator.csproj."
    setup:
      copy_test_files: true
      commands: ["bash setup_fixture.sh without-reference"]
    assertions:
      - { type: "exit_success" }
      - { type: "output_regex", pattern: "(?i)(?:not referenced|references? no|unavailable|package gate fails)" }
      - { type: "command", run: "git status --porcelain", stdout_empty: true }
    rubric:
      - "Does not recommend TedToolkit.RoslynHelper APIs when the active project has no reference to the library."

  - name: "Compile the documented RoslynHelper composition path offline"
    mode: "static"
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh reference-proof"
    assertions:
      - { type: "exit_success" }
      - { type: "command", run: "dotnet run --project Generator.csproj -c Release --no-restore", stdout_contains: "GENERATED_COMPILES", timeout: 120 }
