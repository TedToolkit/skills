config:
  max_parallel_scenarios: 1
  max_parallel_runs: 1

smoke_scenarios:
  - "Write an approved conversational resume artifact"

scenarios:
  - name: "Write an approved conversational resume artifact"
    prompt: >-
      Turn these notes into the finished Markdown resume now; this exact conversational artifact is
      approved. Name: Lin Chen. Target: backend engineer. Experience: built a C# inventory API,
      maintained its SQL schema, and supported the internal warehouse team. No metrics were supplied.
    assertions:
      - { type: "exit_success" }
      - { type: "output_contains", value: "# Lin Chen" }
      - { type: "output_contains", value: "inventory API" }
      - { type: "output_contains", value: "C#" }
      - { type: "output_not_contains", value: "# Resume Strategy" }
      - { type: "output_not_contains", value: "50%" }
    rubric:
      - "Routes the natural final-copy request to write-resume and produces the approved artifact without a redundant strategy gate."
      - "Uses only the supplied scope and does not invent scale, impact, or metrics."
    timeout: 360

  - name: "Tailor an experienced technical resume for recruiter and engineer readers"
    prompt: >-
      Write the finished two-page-target Markdown resume now; this exact conversational artifact is
      approved. Target: senior C# equipment software engineer. Job priorities: WPF desktop software,
      multithreading, native device SDK integration, unit tests, and field defect repair. Evidence:
      Project Atlas shipped a WPF inspection client, used CancellationToken for long scans, wrapped a
      vendor SDK with SafeHandle, and added regression tests for a device disconnect defect. Project
      Forge built a reusable Roslyn analyzer used by two internal libraries. Project GameSkin changed
      game textures and has no connection to the target. No metrics beyond the stated reuse were
      supplied. Make the candidate distinctive through supported engineering choices, not hobbies or
      personality adjectives.
    assertions:
      - { type: "exit_success" }
      - { type: "output_contains", value: "Project Atlas" }
      - { type: "output_contains", value: "CancellationToken" }
      - { type: "output_contains", value: "SafeHandle" }
      - { type: "output_contains", value: "Project Forge" }
      - { type: "output_not_contains", value: "Project GameSkin" }
      - { type: "output_not_contains", value: "rockstar" }
      - { type: "output_not_contains", value: "50%" }
    rubric:
      - "Keeps only projects with visible relevance to the equipment-software target and omits the unrelated portfolio item."
      - "Makes role fit and outcomes legible to a recruiter while preserving enough implementation proof for a technical reader."
      - "Surfaces a supported technical signature such as stabilizing integration boundaries or converting defects into regression proof without inventing personality traits or metrics."
      - "Uses a deliberate two-page information budget for the experienced technical target without padding weak evidence."
    timeout: 360

  - name: "Keep truthful ongoing evidence and reject an unsupported metric"
    prompt: >-
      Propose a resume strategy only. My open-source parser is ongoing: I published a working
      prototype and wrote 'improved performance', but I have no users, production use, measurement,
      or adoption metric. Do not draft the final resume yet.
    assertions:
      - { type: "exit_success" }
      - { type: "output_contains", value: "# Resume Strategy" }
      - { type: "output_contains", value: "working prototype" }
      - { type: "output_contains", value: "ongoing" }
      - { type: "output_not_contains", value: "50%" }
    rubric:
      - "Keeps the candidate-asserted prototype/current state available without implying adoption or production success."
      - "Rejects the unsupported performance claim without blocking the rest of the strategy or suggesting a number."
    timeout: 300

  - name: "Route feedback-only work to resume review"
    prompt: >-
      Tell me what is weak in this excerpt and prioritize fixes, but do not rewrite it: 'Rockstar
      engineer responsible for everything.' I have no job description.
    assertions:
      - { type: "exit_success" }
      - { type: "output_contains", value: "# Resume Review" }
      - { type: "output_not_contains", value: "# Resume Strategy" }
    rubric:
      - "Routes feedback without rewritten copy to review-resume."
    timeout: 300

  - name: "Route comparison-only work to job matching"
    prompt: >-
      Compare my background with this job requirement by requirement, but do not draft or revise a
      resume. Background: C# and SQL. Job: C#, SQL, and Kubernetes.
    assertions:
      - { type: "exit_success" }
      - { type: "output_contains", value: "# Job Match" }
      - { type: "output_contains", value: "Not demonstrated" }
      - { type: "output_not_contains", value: "# Resume Strategy" }
    rubric:
      - "Routes comparison without a draft to match-job-description."
    timeout: 300

  - name: "Keep an approved conversational resume out of the filesystem"
    prompt: >-
      Read candidate-notes.md and return the finished Markdown resume in this conversation. This
      conversational artifact is approved, but do not create or change any file. Keep unresolved
      questions and revision notes outside the resume.
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh"
    assertions:
      - { type: "exit_success" }
      - type: "command"
        run: "git status --porcelain"
        stdout_empty: true
      - { type: "command", run: "test ! -e resume.md" }
      - { type: "output_contains", value: "# Lin Chen" }
      - { type: "output_not_contains", value: "## Notes" }
      - { type: "output_not_contains", value: "50%" }
    rubric:
      - "Produces conversational final copy without treating approval of that response as authorization to write a file."
      - "Keeps unsupported dates, title, employer, contact details, and metrics out of the resume artifact."
    timeout: 360

  - name: "Write only the exact approved resume destination"
    prompt: >-
      Read candidate-notes.md and create the finished resume at the currently absent path resume.md.
      Do not create any companion file; report unresolved questions after the artifact in your
      response, not inside resume.md.
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh"
    assertions:
      - { type: "exit_success" }
      - { type: "file_exists", path: "resume.md" }
      - { type: "file_contains", path: "resume.md", value: "# Lin Chen" }
      - { type: "file_contains", path: "resume.md", value: "inventory API" }
      - { type: "file_not_contains", path: "resume.md", value: "## Notes" }
      - { type: "file_not_contains", path: "resume.md", value: "50%" }
      - type: "command"
        run: "test $(git status --porcelain | wc -l) -eq 1 && git status --porcelain | grep -Fq '?? resume.md'"
    rubric:
      - "Writes only resume.md because the user approved that exact artifact and destination."
      - "Keeps unresolved questions and revision notes outside the saved resume artifact."
      - "Uses candidate-asserted evidence without inventing absent metrics, dates, title, employer, or contact details."
    timeout: 360

  - name: "Protect an existing resume without overwrite authority"
    prompt: >-
      Read candidate-notes.md and write the finished resume to resume.md. Do not create a companion
      file. I have not said to overwrite, replace, or update an existing file.
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh existing"
    assertions:
      - { type: "exit_success" }
      - type: "command"
        run: "test \"$(sha256sum resume.md | cut -d' ' -f1)\" = \"$(cat resume.sha256)\""
      - type: "output_regex"
        pattern: "(?i)overwrite|replace|update"
      - { type: "command", run: "git status --porcelain", stdout_empty: true }
    rubric:
      - "Leaves the existing destination byte-identical and asks for explicit authority for resume.md."
    timeout: 300

  - name: "Translate private repository evidence for unfamiliar hiring readers"
    prompt: >-
      Write the approved final Markdown resume excerpt for a C# equipment-software role. Raw Git
      evidence says: in repository WeldCore, I added Id<T>, DomainObjectResolver,
      RecordEnumValueGenerator, and changed WorkpieceManagerBase; in NativeBridge, I added
      INativeObject, NativeArray<T>, and PooledProtobufBuffer plus release-path tests. The reader has
      never seen either repository. Preserve the supported technical depth and results, but do not
      make internal symbols or repository knowledge necessary to understand the work. No metrics
      were supplied.
    assertions:
      - { type: "exit_success" }
      - { type: "output_contains", value: "C#" }
      - { type: "output_contains", value: "native" }
      - { type: "output_not_contains", value: "DomainObjectResolver" }
      - { type: "output_not_contains", value: "RecordEnumValueGenerator" }
      - { type: "output_not_contains", value: "WorkpieceManagerBase" }
      - { type: "output_not_contains", value: "50%" }
    rubric:
      - "Translates private types into recognizable outcomes such as strongly typed domain identities, compile-time validation/code generation, and managed native-memory ownership."
      - "Makes the system problem, personal action, relevant C# mechanism, and supported delivery/test result understandable without repository context."
      - "Does not invent performance, adoption, production, or scale metrics."
    timeout: 360
