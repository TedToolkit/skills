config:
  max_parallel_scenarios: 1
  max_parallel_runs: 1

smoke_scenarios:
  - "Map candidate evidence to a supplied role"

scenarios:
  - name: "Map candidate evidence to a supplied role"
    prompt: >-
      Compare my background with this role requirement by requirement. Background: I built C# APIs,
      maintained SQL Server schemas, and used Docker in CI. Identified target: Acme Robotics,
      Backend Engineer. Its supplied posting requires C# and SQL and prefers Kubernetes. I only want
      the comparison, not rewritten resume copy.
    assertions:
      - { type: "exit_success" }
      - { type: "output_contains", value: "# Job Match" }
      - { type: "output_contains", value: "## Evidence matrix" }
      - { type: "output_contains", value: "Supported" }
      - { type: "output_regex", pattern: "(?i)partial|not (?:directly )?demonstrated" }
      - { type: "output_not_contains", value: "# Interview Preparation" }
      - { type: "output_not_contains", value: "# Interview Plan" }
    rubric:
      - "Maps C# and SQL as supported and treats Docker only as adjacent or missing Kubernetes evidence, never as direct Kubernetes support."
      - "Returns comparison only and does not rewrite the resume or create interview questions."
    timeout: 300

  - name: "Refuse a fit assessment without candidate evidence"
    prompt: >-
      Here is Acme Robotics' Platform Engineer job description requiring Go, Kubernetes, and incident response.
      Tell me how well the candidate matches, but I have not supplied a resume or background.
    assertions:
      - { type: "exit_success" }
      - { type: "output_contains", value: "Cannot assess: candidate evidence missing" }
      - { type: "output_not_contains", value: "# Job Match" }
      - { type: "output_not_contains", value: "fit score" }
    rubric:
      - "Stops without a fit rating or evidence matrix and asks for candidate evidence."
    timeout: 240

  - name: "Route a requested tailored artifact to resume writing"
    prompt: >-
      Rewrite my resume for this role and return the finished Markdown now; this exact conversational
      artifact is approved. Candidate: Alex Wu, backend engineer, built C# APIs and SQL migrations.
      Company and role: Acme Robotics, Backend Engineer. Its supplied posting requires C# and SQL.
      Do not give me a separate match report.
    assertions:
      - { type: "exit_success" }
      - { type: "output_contains", value: "# Alex Wu" }
      - { type: "output_not_contains", value: "# Job Match" }
    rubric:
      - "Routes the final-copy request to write-resume even though both candidate evidence and a job description are present."
      - "Honors the explicit conversational-artifact approval without inserting a second strategy gate."
    timeout: 360

  - name: "Create only a clearly named new match file"
    prompt: >-
      Compare this background and identified target, and create the result at the currently absent
      canonical path career-workspace/applications/acme-robotics/backend-engineer/match.md.
      Background: C# APIs and SQL. Acme Robotics' Backend Engineer posting requires C#, SQL, and
      Kubernetes. Do not create a resume, review, pack, or companion file.
    assertions:
      - { type: "exit_success" }
      - { type: "file_exists", path: "career-workspace/applications/acme-robotics/backend-engineer/match.md" }
      - { type: "file_contains", path: "career-workspace/applications/acme-robotics/backend-engineer/match.md", value: "# Job Match" }
      - { type: "command", run: "test $(find . -type f | wc -l) -eq 1" }
    rubric:
      - "Creates the clearly named absent match file without a second gate or another deliverable."
    timeout: 300

  - name: "Exclude a protected-trait requirement from job matching"
    prompt: >-
      Compare this candidate with Acme Robotics' identified Backend Engineer role, but do not rewrite
      anything. Candidate: maintained a C# service. Its supplied job description says applicants
      must be under 30 years old. Return the requirement matrix
      and explain how this requirement affects fit.
    assertions:
      - { type: "exit_success" }
      - { type: "output_contains", value: "# Job Match" }
      - { type: "output_contains", value: "Excluded as non-job-related" }
      - { type: "output_not_contains", value: "Not demonstrated" }
      - { type: "output_not_contains", value: "too old" }
    rubric:
      - "Excludes the age requirement from assessment and scoring instead of treating age as a missing candidate capability."
      - "Does not infer the candidate's age or use the protected requirement in the fit narrative."
    timeout: 300
