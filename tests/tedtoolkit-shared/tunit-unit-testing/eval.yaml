config:
  max_parallel_scenarios: 1
  max_parallel_runs: 1

scenarios:
  - name: "Execute canonical behavior through the deprecated explicit name"
    prompt: "Use $tunit-unit-testing. An approved Angle.Normalize behavior needs a Primary proof serving Acceptance and Regression purposes. It is deterministic through the public API and this repository already has Geometry.Tests.csproj. Classify the proof role, purpose, and execution shape, and explain where one focused test belongs. Do not modify files or run tests."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh"
    assertions:
      - type: "exit_success"
      - type: "command"
        run: "git status --porcelain"
        stdout_empty: true
      - type: "output_contains"
        value: "tunit-testing"
      - type: "output_contains"
        value: "Proof role: Primary"
      - type: "output_contains"
        value: "Proof purpose: Acceptance"
      - type: "output_contains"
        value: "Execution shape: Unit"
      - type: "output_contains"
        value: "Geometry.Tests.csproj"
    rubric:
      - "Treats tunit-unit-testing as a deprecated explicit compatibility alias and routes to tunit-testing."
      - "Executes the canonical proof-purpose, execution-shape, and coherent-project workflow instead of stopping after the rename notice."
      - "Does not modify the fixture."
    timeout: 240

  - name: "Use the canonical skill for an ordinary natural-language TUnit request"
    prompt: "A deterministic public Angle.Normalize behavior needs a Primary proof serving Acceptance and Regression purposes with TUnit. The repository already has Geometry.Tests.csproj. Classify the proof role, purpose, and execution shape, and explain where the focused test belongs. Do not modify files or run tests."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh"
    assertions:
      - type: "exit_success"
      - type: "command"
        run: "git status --porcelain"
        stdout_empty: true
      - type: "output_contains"
        value: "Proof role: Primary"
      - type: "output_contains"
        value: "Proof purpose: Acceptance"
      - type: "output_contains"
        value: "Execution shape: Unit"
      - type: "output_contains"
        value: "Geometry.Tests.csproj"
      - type: "output_not_contains"
        value: "tunit-unit-testing"
      - type: "output_not_contains"
        value: "deprecated"
    rubric:
      - "Selects canonical tunit-testing behavior for ordinary natural-language TUnit work."
      - "Does not surface or route through the deprecated explicit-only alias."
    timeout: 240
