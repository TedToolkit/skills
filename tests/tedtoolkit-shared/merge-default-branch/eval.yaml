config:
  max_parallel_scenarios: 1
  max_parallel_runs: 2

scenarios:
  - name: "Clean merge of an up-to-date default branch"
    prompt: "Merge the latest changes from the default branch into my current branch."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh clean-no-conflict"
    assertions:
      - type: "file_exists"
        path: "Feature.cs"
      - type: "file_exists"
        path: "Upstream.cs"
      - type: "file_exists"
        path: "bin/Release/net10.0/App.dll"
      - type: "exit_success"
    rubric:
      - "Brings the upstream changes from the default branch into the current branch (the merge actually happened)."
      - "The project builds successfully in Release configuration after the merge."
      - "Records the merge with a descriptive commit message consistent with the repository's existing gitmoji + Conventional Commit style."
      - "Leaves the working tree clean — no leftover uncommitted changes and no conflict markers."
    timeout: 360

  - name: "Sync with uncommitted local work in progress"
    prompt: "I've got some local edits in progress on this branch. Can you bring it up to date with origin's main branch?"
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh dirty-then-merge"
    assertions:
      - type: "file_contains"
        path: "Program.cs"
        value: "Greeting"
      - type: "file_exists"
        path: "bin/Release/net10.0/App.dll"
      - type: "exit_success"
    rubric:
      - "Preserves the in-progress local edit (the Greeting method) rather than discarding or reverting it."
      - "Commits the local work before merging so it becomes part of the branch history, instead of leaving it dangling or merely stashed."
      - "Brings in the upstream changes and the project still builds in Release configuration."
      - "Leaves the working tree clean after finishing."
    timeout: 420

  - name: "Resolve a conflict where both sides add a feature"
    prompt: "Please merge main into this branch and resolve any conflicts."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh conflict-keep-both"
    assertions:
      - type: "file_contains"
        path: "Geometry.cs"
        value: "Length"
      - type: "file_contains"
        path: "Geometry.cs"
        value: "Bounds"
      - type: "file_not_contains"
        path: "Geometry.cs"
        value: "<<<<<<<"
      - type: "file_exists"
        path: "bin/Release/net10.0/App.dll"
      - type: "exit_success"
    rubric:
      - "Resolves the Geometry.cs conflict by keeping BOTH methods — neither side's feature is dropped."
      - "Demonstrates understanding of what each conflicting change was for, rather than blindly taking one side."
      - "The project builds successfully in Release configuration after the resolution."
      - "Records the merge with a descriptive commit message and leaves a clean working tree."
    timeout: 420

  - name: "Merge compiles cleanly per-side but breaks when combined"
    prompt: "Update my branch with the upstream default branch, and make sure the project still compiles."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh merge-breaks-build"
    assertions:
      - type: "file_contains"
        path: "**/*.cs"
        value: "FeatureArea"
      - type: "file_contains"
        path: "**/*.cs"
        value: "UpstreamArea"
      - type: "file_exists"
        path: "bin/Release/net10.0/App.dll"
      - type: "exit_success"
    rubric:
      - "Detects that the merged code does not compile (a duplicate type) and fixes it instead of committing a broken build."
      - "Keeps BOTH features (FeatureArea and UpstreamArea) when reconciling the duplicate type."
      - "Verifies the Release build is green before finalizing the merge."
      - "Leaves a clean working tree with the merge properly recorded."
    timeout: 480
