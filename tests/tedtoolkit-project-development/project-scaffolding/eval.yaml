config:
  max_parallel_scenarios: 1
  max_parallel_runs: 1

scenarios:
  - name: "Keep one default test project for a small library"
    prompt: "Use $project-scaffolding to audit the test-project structure for this small .NET library. We need focused deterministic tests and acceptance evidence with the same runtime and resources. Recommend the smallest target layout and explain whether separate Unit, Integration, or Acceptance projects are justified. Do not modify files."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh"
    assertions:
      - type: "exit_success"
      - type: "command"
        run: "git status --porcelain"
        stdout_empty: true
      - type: "output_contains"
        value: "tests/Sample.Tests"
    rubric:
      - "Recommends one tests/Sample.Tests project because all evidence has the same execution profile."
      - "Does not manufacture .Unit, .Integration, or .Acceptance projects merely to represent evidence purposes."
      - "Keeps production-to-test dependency direction acyclic and does not modify the repository."
    timeout: 300
