config:
  max_parallel_scenarios: 1
  max_parallel_runs: 1

scenarios:
  - name: "Create an approved principle set"
    prompt: "I approve creation of a compact repository design-principle set in English. Establish dependency direction, compatibility, testability, and observability defaults with owners, review triggers, strengths, and exception routes. The repository is small and all principles have the same owner and revision cadence. Do not modify production code."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh"
    assertions:
      - type: "exit_success"
      - type: "file_exists"
        path: "docs/principles/README.md"
      - type: "file_contains"
        path: "docs/principles/README.md"
        value: "exception"
      - type: "file_contains"
        path: "docs/principles/README.md"
        value: "review"
      - type: "file_contains"
        path: "docs/principles/README.md"
        value: "Required"
      - type: "file_contains"
        path: "docs/principles/README.md"
        value: "Default"
      - type: "command"
        run: "test \"$(find docs/principles -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')\" = 1"
      - type: "file_not_contains"
        path: "docs/principles/*.md"
        value: "pending commit"
      - type: "file_not_contains"
        path: "docs/principles/*.md"
        value: "docs/changes"
      - type: "file_not_contains"
        path: "docs/principles/*.md"
        value: "TRANSIENT-PRINCIPLES-CHANGE"
      - type: "command"
        run: "git diff --exit-code -- Sample.cs"
    rubric:
      - "Distinguishes repository-wide principles from architecture records and ADRs."
      - "Keeps the small same-owner principle set in one README while recording strength, practical implications, review triggers, and exception routes."
      - "The durable principle set does not reference or depend on the temporary docs/changes artifact."
      - "Does not modify production code."
    timeout: 420
