config:
  max_parallel_scenarios: 1
  max_parallel_runs: 1

scenarios:
  - name: "Block a change that misses an approved behavior case"
    prompt: "Review the current change against docs/changes/P1-temperature-parse/work-items/TEMP-001-parse.md. Do not modify files or run commands. Use the exact review report structure and determine whether it is Ready to merge, Ready with follow-ups, or Not ready."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh missing-behavior-case"
    assertions:
      - type: "exit_success"
      - type: "command"
        run: "git status --porcelain"
        stdout_empty: true
      - type: "output_contains"
        value: "Not ready"
      - type: "output_contains"
        value: "BC-02"
      - type: "output_contains"
        value: "Blocking"
      - type: "output_contains"
        value: "Documentation disposition"
    rubric:
      - "Builds a traceability map from the approved BehaviorCases to the changed production and test code."
      - "Identifies that BC-02 is missing from both implementation and tests, and treats it as a blocking finding."
      - "States that it did not run builds or tests and does not modify any file."
      - "Separates a documentation-disposition recommendation from authorization to delete or archive documents."
    timeout: 420

  - name: "Do not infer an implementation boundary from a change index"
    prompt: "Review the current change against docs/changes/P2-geometry-rebuild/README.md. Do not modify files or run commands."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh change-index"
    assertions:
      - type: "exit_success"
      - type: "command"
        run: "git status --porcelain"
        stdout_empty: true
      - type: "output_contains"
        value: "work package"
    rubric:
      - "Explains that an implementation-readiness conclusion requires one selected work package."
      - "Does not infer the work-package boundary from the diff or run tests."
    timeout: 420
