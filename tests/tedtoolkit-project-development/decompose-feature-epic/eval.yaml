config:
  max_parallel_scenarios: 1
  max_parallel_runs: 1

scenarios:
  - name: "Decompose a cross-cutting epic before implementation"
    prompt: "The approved design combines a public API rename, a new generic root interface, source-generator changes, equality semantics, and mesh validation. Do not implement or edit files. Produce the proposed epic document tree, dependency order, decision gates, and independently implementable work-package boundaries."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh geometry-epic"
    assertions:
      - type: "exit_success"
      - type: "command"
        run: "git status --porcelain"
        stdout_empty: true
      - type: "output_contains"
        value: "work package"
      - type: "output_contains"
        value: "dependency"
      - type: "output_contains"
        value: "decision"
    rubric:
      - "Separates enduring architectural decisions, the epic index, and individual implementation work packages."
      - "Does not propose one monolithic implementation change or infer unresolved public semantics from existing code."
      - "Keeps the response read-only until the user approves the decomposition."
    timeout: 420
