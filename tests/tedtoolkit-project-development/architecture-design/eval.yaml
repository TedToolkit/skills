config:
  max_parallel_scenarios: 1
  max_parallel_runs: 1

smoke_scenarios:
  - "Choose service performance evidence at the real boundary"

scenarios:
  - name: "Create an architecture record and traceable ADR"
    prompt: "Design the configuration-store architecture and create an ADR for the accepted decision to use SQLite for embedded configuration. The service requires local persistence without operating a server. Record the status, decision owner as Platform Team, the alternatives PostgreSQL and JSON files, their relevant trade-offs, current architecture boundary, downstream delivery constraints, and review triggers. Do not modify production code or packages."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh"
    assertions:
      - type: "exit_success"
      - type: "file_exists"
        path: "docs/adr/ADR-*.md"
      - type: "file_exists"
        path: "docs/architecture/*.md"
      - type: "file_contains"
        path: "docs/adr/ADR-*.md"
        value: "Decision at a glance"
      - type: "file_contains"
        path: "docs/adr/ADR-*.md"
        value: "Why this decision now"
      - type: "file_contains"
        path: "docs/adr/ADR-*.md"
        value: "SQLite"
      - type: "file_contains"
        path: "docs/adr/ADR-*.md"
        value: "PostgreSQL"
      - type: "file_not_contains"
        path: "docs/adr/ADR-*.md"
        value: "docs/changes"
      - type: "file_not_contains"
        path: "docs/adr/ADR-*.md"
        value: "TRANSIENT-CONFIG-CHANGE"
      - type: "file_not_contains"
        path: "docs/architecture/*.md"
        value: "docs/changes"
      - type: "file_not_contains"
        path: "docs/architecture/*.md"
        value: "TRANSIENT-CONFIG-CHANGE"
      - type: "command"
        run: "git diff --exit-code -- README.md"
    rubric:
      - "The architecture record states the current configuration-store boundary and the ADR makes the accepted decision, governing scope, and owner clear at a glance."
      - "It ties the decision to the no-managed-server constraint and explains the trade-offs of each alternative."
      - "It states only downstream delivery constraints and objective review triggers; it does not claim the decision has been implemented or prescribe source edits, work packages, or delivery procedures."
      - "The durable architecture record and ADR do not reference or depend on the temporary docs/changes artifact."
    timeout: 420

  - name: "Choose service performance evidence at the real boundary"
    prompt: "Do not modify files. Plan the decision evidence for choosing between two remotely hosted configuration services. The decisive risks are concurrent request queuing, database saturation, dependency failures, and end-to-end P95/P99 latency under representative traffic. State the measurement shape and why BenchmarkDotNet is or is not the primary evidence."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh remote-services"
    assertions:
      - { type: "exit_success" }
      - { type: "output_contains", value: "P95" }
      - { type: "output_contains", value: "P99" }
      - { type: "output_contains", value: "load" }
      - { type: "output_contains", value: "BenchmarkDotNet" }
    rubric:
      - "Selects representative service-boundary load and tail-latency evidence including saturation, failures, throughput, and resource use."
      - "Rejects an in-process BenchmarkDotNet project as the primary evidence because it cannot represent remote queuing and dependency behavior."

  - name: "Keep ADR benchmark source and catalog outside the primary solution"
    prompt: "I approve the architecture design and an ADR-specific BenchmarkDotNet experiment to decide between System.Text.Json and Newtonsoft.Json. Create the ADR evidence structure, the benchmark project in its ADR benchmark directory, and docs/adr/Benchmark.slnx. Do not modify Sample.slnx, production code, or CI."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_benchmark_fixture.sh"
    assertions:
      - type: "exit_success"
      - type: "file_exists"
        path: "docs/adr/Benchmark.slnx"
      - type: "file_exists"
        path: "docs/adr/ADR-*/benchmark/*.csproj"
      - type: "file_contains"
        path: "docs/adr/Benchmark.slnx"
        value: "benchmark"
      - type: "command"
        run: "git diff --exit-code -- Sample.slnx"
    rubric:
      - "Keeps ADR-specific executable benchmark source beside its ADR and uses Benchmark.slnx only as a navigation catalog."
      - "Does not add the experiment to the primary solution, default build, CI, or product source tree."
      - "Records reproducible evidence without committing generated BenchmarkDotNet build artifacts."
    timeout: 420
