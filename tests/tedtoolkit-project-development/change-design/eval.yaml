config:
  max_parallel_scenarios: 1
  max_parallel_runs: 1

scenarios:
  - name: "Run canonical Fast classification through the deprecated design name"
    prompt: "Use $change-design for a local comment spelling correction with no behavior, API, persistence, security, migration, architecture, or external-operation impact. Give the current workflow profile, change kind, proof, and pre-write plan, then stop without modifying files."
    assertions:
      - { type: "exit_success" }
      - { type: "output_contains", value: "design-change" }
      - { type: "output_contains", value: "Fast" }
      - { type: "output_contains", value: "maintenance" }
      - { type: "output_not_contains", value: "docs/changes/" }
      - { type: "command", run: "test -z \"$(find . -mindepth 1 -not -name .git -print -quit)\"" }
    rubric:
      - "Announces the rename, then actually follows canonical design-change classification rather than stopping after the routing message."
      - "Uses the Fast maintenance path and produces no workflow artifact."
    timeout: 240

  - name: "Ordinary change design uses the canonical skill without migration noise"
    prompt: "Design one bounded reversible correction for an internal clamp helper. Name the selected workflow, classify the change, explain the lightest safe profile and decisive evidence, and stop before writing files."
    assertions:
      - { type: "exit_success" }
      - { type: "output_contains", value: "design-change" }
      - { type: "output_contains", value: "bug-fix" }
      - { type: "output_regex", pattern: '(?i)\b(?:Fast|Standard)\b' }
      - { type: "output_regex", pattern: '(?i)\b(?:primary proof|verification)\b' }
      - { type: "output_not_contains", value: "deprecated" }
      - { type: "output_not_contains", value: "renamed" }
      - { type: "command", run: "test -z \"$(find . -mindepth 1 -not -name .git -print -quit)\"" }
    rubric:
      - "Routes the natural-language request to design-change rather than the deprecated alias."
    timeout: 240
