config:
  max_parallel_scenarios: 1
  max_parallel_runs: 1

scenarios:
  - name: "Redirect a mistaken planning request for one approved delivery"
    prompt: "Use $plan-work-items on docs/changes/temperature-clamp/change.md because I assume planning work items is next. Inspect the approved record and route the actual next phase. Do not modify files."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh standard-single"
    assertions:
      - { type: "exit_success" }
      - { type: "command", run: "git status --porcelain", stdout_empty: true }
      - { type: "command", run: "test ! -e docs/changes/temperature-clamp/work-items.md" }
      - { type: "output_contains", value: "implement-change" }
    rubric:
      - "Corrects the user's mistaken internal route from persisted profile and delivery shape instead of asking whether the work is simple or complex."
      - "Reports direct implementation as the one next phase and creates no one-row map."
    timeout: 300

  - name: "Profile routing keeps a single Standard delivery inline"
    prompt: "Inspect the approved Standard change at docs/changes/temperature-clamp/change.md and decide whether to create work items. Do not modify production code or tests."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh standard-single"
    assertions:
      - type: "exit_success"
      - type: "command"
        run: "test ! -d docs/changes/temperature-clamp/work-items"
      - type: "output_contains"
        value: "implement-change"
      - type: "command"
        run: "git status --porcelain"
        stdout_empty: true
    rubric:
      - "Recognizes that a Standard change with one independently implementable delivery keeps its brief in change.md."
      - "Does not manufacture a one-row delivery map or duplicate the human handoff into a work-item file."
    timeout: 300

  - name: "Plan bounded work items from an approved change"
    prompt: "Use the approved Controlled temperature ingestion change at docs/changes/temperature-ingestion/change.md to create its two-item delivery plan. Reserved empty files TEMP-001-parser.md and TEMP-002-ingestion.md exist; populate those exact files. The parser supplies the verified public TryParse contract consumed by ingestion. Do not modify production code or tests."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh controlled-multi"
    assertions:
      - type: "exit_success"
      - type: "file_contains"
        path: "docs/changes/temperature-ingestion/change.md"
        value: "<!-- delivery-shape: multi-item -->"
      - type: "file_exists"
        path: "docs/changes/temperature-ingestion/work-items/TEMP-001-parser.md"
      - type: "file_contains"
        path: "docs/changes/temperature-ingestion/work-items.md"
        value: "TEMP-002"
      - type: "file_contains"
        path: "docs/changes/temperature-ingestion/work-items/TEMP-001-parser.md"
        value: "<!-- work-item-format: 2 -->"
      - type: "file_contains"
        path: "docs/changes/temperature-ingestion/work-items/TEMP-001-parser.md"
        value: "<!-- work-item-id: TEMP-001 -->"
      - type: "file_contains"
        path: "docs/changes/temperature-ingestion/work-items/TEMP-002-ingestion.md"
        value: "<!-- work-item-format: 2 -->"
      - type: "file_contains"
        path: "docs/changes/temperature-ingestion/work-items.md"
        value: "Owns AC-01"
      - type: "file_contains"
        path: "docs/changes/temperature-ingestion/work-items.md"
        value: "Owns AC-02"
      - type: "file_contains"
        path: "docs/changes/temperature-ingestion/work-items/TEMP-002-ingestion.md"
        value: "TEMP-001"
      - type: "file_contains"
        path: "docs/changes/temperature-ingestion/work-items/TEMP-001-parser.md"
        value: "<!-- primary-proof: AC-01"
      - type: "file_contains"
        path: "docs/changes/temperature-ingestion/work-items/TEMP-002-ingestion.md"
        value: "<!-- primary-proof: AC-02"
      - type: "file_contains"
        path: "docs/changes/temperature-ingestion/work-items.md"
        value: "<!-- approval-source: none -->"
      - type: "command"
        run: "grep -Eq '^\\| TEMP-001 .*\\| Draft \\|' docs/changes/temperature-ingestion/work-items.md && grep -Eq '^\\| TEMP-002 .*\\| Draft \\|' docs/changes/temperature-ingestion/work-items.md"
      - type: "file_not_contains"
        path: "docs/changes/temperature-ingestion/work-items.md"
        value: "person-month"
      - type: "file_not_contains"
        path: "docs/changes/temperature-ingestion/work-items.md"
        value: "| Primary proof |"
      - type: "file_not_contains"
        path: "docs/changes/temperature-ingestion/work-items/TEMP-001-parser.md"
        value: "Executable implementation steps"
      - type: "command"
        run: "git diff --exit-code -- Temperature.cs Ingestion.cs TemperatureTests.cs"
    rubric:
      - "Creates exactly the two necessary work items, each with one independently observable outcome."
      - "Creates work items only for bounded repository modifications; it keeps research, design review, approval, coordination, and external operations out of the delivery map."
      - "Records only real logical prerequisites and does not invent a total serial order for independent work items."
      - "Names the expected affected delivery area and makes public contracts exact without treating internal files or private symbols as an exhaustive authorization list."
      - "References every parent acceptance case, assigns exactly one owner, and treats the parser result as a concrete supplied prerequisite for ingestion."
      - "Gives every item start conditions, constraints, primary proof, an objective definition of done, and completion evidence that can unlock dependent work without requiring fixed test layers."
      - "Keeps the proof definition in each item document instead of repeating a proof-summary column in work-items.md."
      - "Does not prescribe executable edit steps, private type structure, algorithms, or method decomposition."
      - "Does not change the approved behavior contract or implement production code."
    timeout: 420

  - name: "Reject an unapproved or incomplete change instead of inventing work items"
    prompt: "Create a work-item delivery plan for the incomplete change. Do not modify production code or tests."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh incomplete"
    assertions:
      - type: "exit_success"
      - type: "command"
        run: "test ! -d docs/changes/P1-incomplete-change/work-items"
    rubric:
      - "Stops because the parent change is not approved and does not invent missing behavior, artifacts, prerequisites, or verification."
      - "Returns the change to design-change rather than creating delivery work items."
    timeout: 240
