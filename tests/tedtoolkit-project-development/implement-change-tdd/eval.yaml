config:
  max_parallel_scenarios: 1
  max_parallel_runs: 1

scenarios:
  - name: "Run the canonical refactor loop through the deprecated implementation name"
    prompt: "Use $implement-change-tdd to explain how the current implementation workflow handles an approved internal reorganization whose public invariant is already Green. Give the loop and proof order only; do not modify files."
    assertions:
      - { type: "exit_success" }
      - { type: "output_contains", value: "implement-change" }
      - { type: "output_contains", value: "behavior-preserving" }
      - { type: "output_contains", value: "characterization" }
      - { type: "output_not_contains", value: "must start Red" }
      - { type: "command", run: "test -z \"$(find . -mindepth 1 -not -name .git -print -quit)\"" }
    rubric:
      - "Announces the rename, then follows implement-change's characterization-Green refactor loop without forcing an artificial Red."
    timeout: 240

  - name: "Ordinary TDD implementation uses the canonical skill without migration noise"
    prompt: "An approved defect correction is ready. Name the selected workflow and explain its ordered local feedback cycle, then stop before edits."
    assertions:
      - { type: "exit_success" }
      - { type: "output_contains", value: "implement-change" }
      - { type: "output_regex", pattern: '(?is)\breproduc\w*\b.{0,800}\bfix\w*\b.{0,800}\bregression\b' }
      - { type: "output_not_contains", value: "deprecated" }
      - { type: "output_not_contains", value: "renamed" }
      - { type: "command", run: "test -z \"$(find . -mindepth 1 -not -name .git -print -quit)\"" }
    rubric:
      - "Routes the natural-language implementation request to implement-change, not the compatibility alias."
    timeout: 240
