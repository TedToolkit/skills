# Change-design-review evals
config:
  max_parallel_scenarios: 1
  max_parallel_runs: 1

scenarios:
  - name: "Block an incomplete change design before planning"
    prompt: "Review docs/changes/P1-temperature-parse/change.md as a change design. Do not modify files, create work items, or inspect implementation."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh incomplete-design"
    assertions:
      - type: "exit_success"
      - type: "command"
        run: "git status --porcelain"
        stdout_empty: true
      - type: "output_contains"
        value: "Needs revision"
      - type: "output_contains"
        value: "Acceptance specification"
      - type: "output_not_contains"
        value: "Ready to merge"
    rubric:
      - "Identifies that an API-shaped goal and missing observable Acceptance specification make the design unready."
      - "Does not create a work item, review implementation, or claim to approve the design."
    timeout: 420

  - name: "Mark a complete design ready for human approval"
    prompt: "Act as a fresh read-only reviewer of the exact Draft at docs/changes/P1-temperature-parse/change.md. Review it without modifying files or creating work items."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh approval-ready-design"
    assertions:
      - type: "exit_success"
      - type: "command"
        run: "git status --porcelain"
        stdout_empty: true
      - type: "output_contains"
        value: "Ready for approval"
      - type: "output_contains"
        value: "Not reviewed: implementation"
    rubric:
      - "Separates readiness for human approval from granting approval."
      - "Keeps implementation and documentation-disposition decisions outside this review."
    timeout: 420

  - name: "Block a durable decision without an accepted ADR"
    prompt: "Review docs/changes/P1-temperature-parse/change.md as a change design. Do not modify files or create work items."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh missing-accepted-adr"
    assertions:
      - type: "exit_success"
      - type: "command"
        run: "git status --porcelain"
        stdout_empty: true
      - type: "output_contains"
        value: "Needs revision"
      - type: "output_contains"
        value: "ADR"
      - type: "output_contains"
        value: "architecture-design"
    rubric:
      - "Treats an unlinked, library-wide parsing policy as a blocking durable decision."
      - "Routes ADR creation and approval to architecture-design before change approval."
    timeout: 420

  - name: "Block a contract whose material rationale is missing"
    prompt: "Review docs/changes/P1-temperature-parse/change.md as a change design. Do not modify files or create work items. Route material rationale gaps to design-change."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh missing-rationale"
    assertions:
      - type: "exit_success"
      - type: "command"
        run: "git status --porcelain"
        stdout_empty: true
      - type: "output_contains"
        value: "Needs revision"
      - type: "output_contains"
        value: "why"
      - type: "output_contains"
        value: "design-change"
    rubric:
      - "Treats a technically complete-looking contract without problem, value, why-now, or claim provenance as blocking."
      - "Routes the missing rationale to design-change and does not invent business intent from the proposed API."
    timeout: 420

  - name: "Block a user answer that was never persisted"
    prompt: "During clarification I answered that existing callers must remain source- and binary-compatible, but docs/changes/P1-temperature-parse/change.md does not record that answer or its source. Review the design without modifying files or creating work items, and route the gap to design-change."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh approval-ready-design"
    assertions:
      - type: "exit_success"
      - type: "command"
        run: "git status --porcelain"
        stdout_empty: true
      - type: "output_contains"
        value: "Needs revision"
      - type: "output_contains"
        value: "compatib"
      - type: "output_contains"
        value: "design-change"
    rubric:
      - "Treats a material compatibility answer supplied in conversation but absent from the change's current truth as blocking."
      - "Does not require an agent log in the human document and does not substitute reviewer memory for persisted current truth."
    timeout: 420
