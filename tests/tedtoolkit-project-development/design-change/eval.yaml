config:
  max_parallel_scenarios: 1
  max_parallel_runs: 1

smoke_scenarios:
  - "Profile routing keeps mechanical maintenance fast"

scenarios:
  - name: "Profile routing keeps mechanical maintenance fast"
    prompt: "Use $design-change to classify a comment spelling correction and whitespace-only cleanup in Temperature.cs. There is one local, reversible outcome, no observable behavior change, no public contract, migration, security, or external operation. Show the human-readable implementation plan and stop before modifying files."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh fast-maintenance"
    assertions:
      - type: "exit_success"
      - type: "output_contains"
        value: "Fast"
      - type: "command"
        run: "test ! -d docs/changes"
      - type: "command"
        run: "git status --porcelain"
        stdout_empty: true
    rubric:
      - "Classifies the request as Fast because it is mechanical, local, reversible, and behavior-preserving."
      - "Presents one concise human-readable pre-write plan with verification and does not create a workflow document."
      - "Does not invoke design review, work-item planning, or multi-agent orchestration."
    timeout: 300

  - name: "Profile routing creates one concise Standard handoff"
    prompt: "Use $design-change to create an @-addressable change.md for cross-conversation recovery of a fix for the internal Temperature.Clamp helper: values already inside the valid range must be returned unchanged, but the current implementation rounds them. This is one local, reversible behavior fix, changes no public API or persistence format, needs no migration or architecture decision, and can be proven through the existing public Temperature.Normalize behavior. This request pre-approves creating the Draft after you show the bounded plan. Write the human-readable change design only; do not modify production code or tests."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh standard-internal-fix"
    assertions:
      - type: "exit_success"
      - type: "file_exists"
        path: "docs/changes/*/change.md"
      - type: "file_contains"
        path: "docs/changes/*/change.md"
        value: "<!-- workflow-profile: standard -->"
      - type: "file_contains"
        path: "docs/changes/*/change.md"
        value: "<!-- change-kind: bug-fix -->"
      - type: "file_contains"
        path: "docs/changes/*/change.md"
        value: "<!-- primary-proof: AC-01"
      - type: "file_contains"
        path: "docs/changes/*/change.md"
        value: "<!-- change-status: draft -->"
      - type: "file_contains"
        path: "docs/changes/*/change.md"
        value: "<!-- delivery-shape: single -->"
      - type: "file_contains"
        path: "docs/changes/*/change.md"
        value: "<!-- approval-source: none -->"
      - type: "file_contains"
        path: "docs/changes/*/change.md"
        value: "Delivery brief"
      - type: "file_not_contains"
        path: "docs/changes/*/change.md"
        value: "Clarification and decision log"
      - type: "file_not_contains"
        path: "docs/changes/*/change.md"
        value: "person-month"
      - type: "command"
        run: "test -z \"$(find docs/changes -type d -name work-items -print -quit)\""
      - type: "command"
        run: "test $(wc -l < docs/changes/*/change.md) -le 100"
      - type: "command"
        run: "git diff --exit-code -- Temperature.cs TemperatureTests.cs"
    rubric:
      - "Classifies the request as Standard: one bounded low-risk behavior change with one delivery slice."
      - "Writes current approved truth for a human implementer rather than an agent transcript or workflow ledger."
      - "Uses one narrow reliable proof through the public Normalize boundary; it does not require separate Unit, Integration, and Acceptance suites."
      - "Embeds the single delivery brief in change.md and does not create a work item or delivery map."
    timeout: 420

  - name: "Create an approval-ready change design"
    prompt: "Use $design-change to create the P1 change design at docs/changes/temperature-tryparse/change.md for adding a TryParse(string?, out Temperature) API to the existing Temperature value object. Library callers currently duplicate inconsistent parsing and some accept impossible temperatures, causing incorrect domain values at API boundaries; this change is needed now before a new ingestion API makes that duplication public. It must accept invariant-culture decimal Celsius input using an optional sign, digits, and an optional `.` fractional part; reject null, whitespace-only, invalid text, group separators, exponent notation, values with leading or trailing whitespace, and values below absolute zero. On every failure it must return false and set the out value to default; existing callers must remain source- and binary-compatible. This request pre-approves creating the Draft after you show the bounded plan. Write the repository change design only; do not create work items, production code, or tests."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh temperature-design"
    assertions:
      - type: "exit_success"
      - type: "file_exists"
        path: "docs/changes/*/change.md"
      - type: "file_contains"
        path: "docs/changes/*/change.md"
        value: "<!-- change-format: 3 -->"
      - type: "file_contains"
        path: "docs/changes/*/change.md"
        value: "<!-- workflow-profile: controlled -->"
      - type: "file_contains"
        path: "docs/changes/*/change.md"
        value: "<!-- change-kind: behavior-change -->"
      - type: "file_contains"
        path: "docs/changes/*/change.md"
        value: "Goal"
      - type: "file_contains"
        path: "docs/changes/*/change.md"
        value: "Delivery brief"
      - type: "file_contains"
        path: "docs/changes/*/change.md"
        value: "<!-- primary-proof: AC-01"
      - type: "file_contains"
        path: "docs/changes/*/change.md"
        value: "<!-- change-status: draft -->"
      - type: "file_contains"
        path: "docs/changes/*/change.md"
        value: "<!-- delivery-shape: single -->"
      - type: "file_contains"
        path: "docs/changes/*/change.md"
        value: "<!-- approval-source: none -->"
      - type: "file_contains"
        path: "docs/changes/*/change.md"
        value: "AC-01"
      - type: "file_contains"
        path: "docs/changes/*/change.md"
        value: "```gherkin"
      - type: "file_contains"
        path: "docs/changes/*/change.md"
        value: "TryParse"
      - type: "file_contains"
        path: "docs/changes/*/change.md"
        value: "absolute zero"
      - type: "file_not_contains"
        path: "docs/changes/*/change.md"
        value: "person-month"
      - type: "file_not_contains"
        path: "docs/changes/*/change.md"
        value: "Clarification and decision log"
      - type: "command"
        run: "test -z \"$(find docs/changes -name README.md -print -quit)\""
      - type: "command"
        run: "git diff --exit-code -- Temperature.cs TemperatureTests.cs"
    rubric:
      - "The document distinguishes scope from non-goals and gives observable success and failure behavior."
      - "Classifies the public API compatibility change as Controlled and records the problem, affected callers, consequence, value, and reason to act now concisely."
      - "Defines exactly one result-oriented change goal rather than naming an API, file, or implementation task."
      - "The change record contains current implementation-facing truth without narrating the request's origin or retaining an agent log."
      - "States observable success, failure, and boundary behavior as stable AC-ID scenarios and gives each contract one proportionate primary proof."
      - "Keeps priority as metadata rather than coupling it to the directory name, and does not require a person-month estimate."
      - "Keeps one delivery brief inline because the public API change has one independently implementable outcome; it does not manufacture a work item."
      - "It does not present a standalone change as blocked by another planned or in-progress change."
      - "It records compatibility and invariant-culture parsing considerations without inventing unrelated architecture."
    timeout: 420

  - name: "Redirect several independent outcomes to scoping"
    prompt: "Use $design-change on a request that simultaneously renames several public API families, rewrites a source generator, changes equality semantics, and adds a new validated mesh abstraction. Do not modify files or create records; identify the exact boundary problem and route it correctly."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh large-feature"
    assertions:
      - type: "exit_success"
      - type: "command"
        run: "git status --porcelain"
        stdout_empty: true
      - type: "output_contains"
        value: "scope-changes"
    rubric:
      - "Recognizes several potentially independently valuable outcomes instead of inflating them into one Controlled umbrella change."
      - "Redirects the raw request to scope-changes with concrete boundary evidence; it does not start detailed contract design or work-item planning."
    timeout: 420

  - name: "Return a cross-change dependency to scoping"
    prompt: "Use $design-change to add a preferences screen. It claims to require the independently planned settings-store change in docs/changes/P2-settings-store/change.md, which has not been implemented. Do not modify files; identify who owns the dependency and completion-boundary decision."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh dependent-change"
    assertions:
      - type: "exit_success"
      - type: "command"
        run: "git status --porcelain"
        stdout_empty: true
      - type: "output_contains"
        value: "scope-changes"
    rubric:
      - "Returns the cross-change dependency and possible inseparability decision to scope-changes instead of hiding it inside implementation planning."
      - "Names the exact boundary evidence and does not decide detailed settings behavior for either candidate."
    timeout: 420

  - name: "Author an already-scoped cross-change prerequisite"
    prompt: "The partition and dependency are already authorized: create the Draft preferences-screen change at docs/changes/preferences-screen/change.md. It remains standalone but requires docs/changes/settings-store/change.md AC-01 to be completed on the implementation baseline. Record the concrete supplied guarantee and required readiness evidence, validate the Draft structurally, and stop without approving, planning, or implementing it."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh scoped-dependent-draft"
    assertions:
      - { type: "exit_success" }
      - { type: "file_contains", path: "docs/changes/preferences-screen/change.md", value: "<!-- section: start-conditions -->" }
      - { type: "file_contains", path: "docs/changes/preferences-screen/change.md", value: "<!-- change-prerequisite: PRE-01 source=../settings-store/change.md contract=AC-01 -->" }
      - { type: "file_contains", path: "docs/changes/preferences-screen/change.md", value: "Required readiness evidence" }
      - { type: "file_not_contains", path: "docs/changes/preferences-screen/change.md", value: "<!-- change-prerequisite: none -->" }
      - { type: "command", run: "test ! -e docs/changes/preferences-screen/work-items.md" }
    rubric:
      - "Restates the authorized source outcome as a concrete PRE-01 contract instead of depending on priority, a change ID, or planned status alone."
      - "Keeps the dependent change standalone and records expected readiness evidence without claiming the upstream result already passed."
      - "Runs structural validation only; it does not block Draft authoring because the approved source is not yet completed."
    timeout: 600

  - name: "Clarify a material contract uncertainty before creating a Draft"
    prompt: "The scoped candidate is to add display-density preferences. I have not said whether the preference must persist across restarts, whether it is per-user or machine-wide, or what happens when stored data is invalid. Investigate and ask the highest-impact contract question, but do not create a repository Draft yet."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh temperature-design"
    assertions:
      - type: "exit_success"
      - type: "command"
        run: "git status --porcelain"
        stdout_empty: true
      - type: "output_contains"
        value: "persist"
    rubric:
      - "Asks one question about persisted behavior or ownership because it can change the observable contract, compatibility risk, and profile."
      - "Does not create a repository Draft merely to collect answers or ask the user to choose the workflow profile."
    timeout: 420

  - name: "Persist an answer before any next design action"
    prompt: "Continue docs/changes/compatibility/change.md. Existing callers must remain source- and binary-compatible. Record that current truth immediately as 'Compatibility requirement: source- and binary-compatible.' Remove the unresolved wording, report that the current truth was updated, and stop before asking another question or doing more research."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh answer-persistence"
    assertions:
      - type: "exit_success"
      - type: "file_contains"
        path: "docs/changes/compatibility/change.md"
        value: "Compatibility requirement: source- and binary-compatible."
      - type: "file_not_contains"
        path: "docs/changes/compatibility/change.md"
        value: "Compatibility is unresolved"
      - type: "file_not_contains"
        path: "docs/changes/compatibility/change.md"
        value: "Clarification and decision log"
      - type: "output_regex"
        pattern: "(?i)updated"
    rubric:
      - "Updates the implementation-facing compatibility truth before performing another clarification or investigation."
      - "Does not add conversation history, a receipt, or an agent-oriented decision ledger to the human handoff."
      - "Does not treat the compatibility answer as approval of the whole design."
    timeout: 300

  - name: "Clarify material uncertainty instead of asking the user to classify the change"
    prompt: "Design a change to add caching around CacheConsumer. I have not explained the affected user, observed problem, consequence, why this is needed now, consistency requirements, or acceptable staleness. Investigate what the repository can answer, ask the single highest-impact material question, and stop. Do not create a change record or modify files."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh ambiguous-cache"
    assertions:
      - type: "exit_success"
      - type: "command"
        run: "git status --porcelain"
        stdout_empty: true
      - type: "output_contains"
        value: "problem"
      - type: "output_not_contains"
        value: "Which workflow profile"
    rubric:
      - "Uses repository evidence first, then asks one material question that can change the goal or observable cache contract."
      - "Does not ask the user whether the change is simple, complex, Fast, Standard, or Controlled; profile selection remains the skill's responsibility."
      - "Does not turn every missing detail into a questionnaire or create a Draft merely to collect answers."
    timeout: 420

  - name: "Design an experiment as evidence rather than production behavior"
    prompt: "Create a Draft change at docs/changes/parser-allocation-experiment/change.md for an isolated parser allocation experiment. Its decision question is whether a candidate parser reduces allocations on the representative ingestion dataset without more than 5% latency regression. Stop after 30 minutes or one complete dataset run, record the Platform Team as evidence owner, and require a separate approved behavior change before any production adoption. Do not modify production code or approve the Draft."
    setup:
      copy_test_files: true
      commands:
        - "bash setup_fixture.sh temperature-design"
    assertions:
      - type: "exit_success"
      - type: "file_contains"
        path: "docs/changes/parser-allocation-experiment/change.md"
        value: "<!-- change-kind: experiment -->"
      - type: "file_contains"
        path: "docs/changes/parser-allocation-experiment/change.md"
        value: "<!-- section: experiment-contract -->"
      - type: "file_contains"
        path: "docs/changes/parser-allocation-experiment/change.md"
        value: "EXP-01"
      - type: "file_not_contains"
        path: "docs/changes/parser-allocation-experiment/change.md"
        value: "<!-- acceptance-case: AC-"
      - type: "file_contains"
        path: "docs/changes/parser-allocation-experiment/change.md"
        value: "<!-- change-status: draft -->"
      - type: "command"
        run: "git diff --exit-code -- Temperature.cs TemperatureTests.cs"
    rubric:
      - "Captures the decision question, representative method, falsification threshold, stop condition, evidence owner, and downstream decision without inventing product behavior ACs."
      - "Treats successful evidence as input to a separate approved change rather than implementation authority."
    timeout: 600
