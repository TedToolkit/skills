config:
  max_parallel_scenarios: 1
  max_parallel_runs: 1

scenarios:
  - name: "Validate project-development release and invocation contract offline"
    mode: "static"
    setup:
      copy_test_files: true
      commands:
        - "py -3.10 check.py --repo-root \"${REPO_ROOT}\""
        - "py -3.10 \"${REPO_ROOT}/tests/tedtoolkit-project-development/plugin-contract/test_check.py\""
    assertions:
      - { type: "exit_success" }
      - { type: "output_contains", value: "OK: project-development plugin contract" }
