config:
  max_parallel_scenarios: 1
  max_parallel_runs: 1

smoke_scenarios:
  - "Keep a bounded comment request inside its named surface"

scenarios:
  - name: "Draft useful documentation for a type, property, and method"
    prompt: "Review Sample.cs without modifying it. Draft clear XML documentation for Sample, MaxConcurrency, and Create."
    setup:
      copy_test_files: true
      commands: ["bash setup_fixture.sh Documentations"]
    assertions:
      - { type: "exit_success" }
      - { type: "output_contains", value: "<summary>" }
      - { type: "output_contains", value: "<returns>" }
      - { type: "output_contains", value: "<value>" }
    rubric:
      - "Explains the type, property, and method contracts without narrating obvious syntax."

  - name: "Keep a bounded comment request inside its named surface"
    prompt: "Review Sample.cs without modifying it. Draft XML documentation only for Calculator.Add. There is no repository policy requiring broader coverage. Do not document or discuss unrelated declarations."
    setup:
      copy_test_files: true
      commands: ["bash setup_fixture.sh Documentations comment-scope"]
    assertions:
      - { type: "exit_success" }
      - { type: "output_contains", value: "Add" }
      - { type: "output_contains", value: "<summary>" }
      - { type: "output_not_contains", value: "Unrelated" }
      - { type: "output_not_contains", value: "OpenLease" }
    rubric:
      - "Documents only Calculator.Add and does not expand scope because other declarations are public."

  - name: "Expand comment scope only when repository policy requires it"
    prompt: "Review AGENTS.md and Sample.cs without modifying them. Draft the XML documentation required for a change to Calculator.Add, and state why any declaration beyond Add is included."
    setup:
      copy_test_files: true
      commands: ["bash setup_fixture.sh Documentations comment-policy"]
    assertions:
      - { type: "exit_success" }
      - { type: "output_contains", value: "Add" }
      - { type: "output_contains", value: "Unrelated" }
      - { type: "output_contains", value: "OpenLease" }
      - { type: "output_contains", value: "policy" }
    rubric:
      - "Expands only to the public declarations required by the nearest repository policy and explains that expansion."

  - name: "Use examples only when they change caller understanding"
    prompt: "Review Sample.cs without modifying it. Draft XML documentation for Calculator.Add and Calculator.OpenLease. Add an example only where it teaches non-obvious lifecycle or misuse behavior. Explicitly report `Example omitted: Add` when no Add example is warranted."
    setup:
      copy_test_files: true
      commands: ["bash setup_fixture.sh Documentations comment-examples"]
    assertions:
      - { type: "exit_success" }
      - { type: "output_contains", value: "Example omitted: Add" }
      - { type: "output_contains", value: "<example>" }
      - { type: "output_contains", value: "OpenLease" }
    rubric:
      - "Omits a routine Add example while giving OpenLease a small usable lifecycle/disposal example."
